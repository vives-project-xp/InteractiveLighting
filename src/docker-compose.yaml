services:
  backend:
    container_name: backend
    build: ./Backend/
    ports:
     - "3000:3000"
    environment:
      - PORT=3000
    restart: always

    
  frontend:
    container_name: frontend
    build: ./frontend/interactive-lighting-frontend
    depends_on:
      - backend
    ports:
     - "5137:5137"

