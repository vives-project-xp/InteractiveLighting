services:
  backend:
    
    build: ./Backend/
    ports:
     - "${BACKEND_PORT}:3000"
    environment:
      - PORT=3000
    restart: always
    env_file:
      - .env

    
  frontend:
    
    build: ./frontend/
    depends_on:
      - backend
    ports:
     - "${FRONTEND_PORT}:5173"
    env_file:
      - .env

